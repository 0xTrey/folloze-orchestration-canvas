name: Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Deploy production Worker
        if: github.event_name != 'pull_request'
        run: npx opennextjs-cloudflare deploy --skipBuild
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production Worker
        if: github.event_name != 'pull_request'
        run: npm run verify:production -- https://folloze-orchestration-canvas.harnden-trey.workers.dev
